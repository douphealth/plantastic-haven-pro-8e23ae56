name: Regenerate dependency lock

on:
  push:
    branches:
      - "fix/real-auth-stripe-premium-20260929"

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate lockfile with current npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit corrected lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "Regenerate npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
