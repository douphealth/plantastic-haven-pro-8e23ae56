name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck web app
        run: npx --no-install tsc -p tsconfig.app.json --noEmit

      - name: Use Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Supabase Edge Functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/create-payment/index.ts
          deno check --node-modules-dir=auto supabase/functions/check-payment/index.ts
          deno check --node-modules-dir=auto supabase/functions/stripe-webhook/index.ts
          deno check --node-modules-dir=auto supabase/functions/plant-identifier/index.ts

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
